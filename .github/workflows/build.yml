name: Build site

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Attach dist/ as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: credence-site
          path: dist/
          include-hidden-files: true
          retention-days: 30
